# field_definitions.yaml (DRAFT — not yet placed in the repo)
#
# Suggested location once you're ready: core/field_definitions.yaml
# (sits alongside standard.py / layers.py / multipart.py, read by a future
# shared core/fields.py module).
#
# Scope: this file covers metadata fields subject to preset selection.
# It does NOT cover structural columns each script always emits regardless
# of preset (Item ARK, Parent ARK, Object Type, Title, File Name, and
# page-level Item Sequence) — those stay hardcoded in the scripts.
#
# levels: which row type(s) a field applies to (collection / work / page /
# layer) and its tier there:
#   required    — always included in every preset
#   recommended — included in "Required + Recommended" and all named presets
#   optional    — only included via the picklist (Phase 2) or a preset tag
#   (level omitted entirely = field doesn't apply at that level)
#
# tags: preset-specific groupings. A named preset = required ∪ recommended
# ∪ fields tagged with that preset's tag (see `presets:` below).
#
# pre_fillable: whether the GUI should show a default-value input for this
# field. false = column-only, never form-driven (e.g. Title, Local
# identifier — always item-specific, never a shared default).

